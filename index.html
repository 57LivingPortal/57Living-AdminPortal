<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#641c2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="57LIVING">
  <title>57LIVING Admin Portal</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f4f1; color: #2e2022; font-family: Arial, sans-serif; }
    main { width: min(100%, 390px); padding: 30px 24px; text-align: center; background: #fff; border-radius: 22px; box-shadow: 0 12px 36px rgba(48, 20, 25, .12); }
    img { width: 128px; height: 128px; object-fit: contain; }
    h1 { margin: 18px 0 8px; color: #641c2b; font-size: 24px; }
    p { color: #65575a; line-height: 1.55; }
    a.button { display: block; margin-top: 22px; padding: 15px 18px; border-radius: 12px; background: #641c2b; color: #fff; text-decoration: none; font-weight: 700; }
    .note { margin-top: 18px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="57LIVING logo">
    <h1>57LIVING Admin Portal</h1>
    <p>Open your existing admin portal securely using your usual Google Apps Script login.</p>
    <a class="button" id="openPortal" href="https://script.google.com/macros/s/AKfycbwqetn9N51U3lPV3fVImc_Ec-EuBrvvHkatjc08IBRLuCYpqSjmwKl8cg76TIciOvTVJA/exec">Open Admin Portal</a>
    <p class="note">Your portal's login, permissions and data remain managed by Google Apps Script.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
